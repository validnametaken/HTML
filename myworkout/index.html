<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Workout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="audio-overlay">
        <div id="audio-overlay-text">Tap to enable sound</div>
    </div>
    <div id="loading-overlay">Loading...</div>
    <main id="workout">
        <header>
            <h1>My Workout</h1>
            <div class="controls-top">
                <button id="settingsBtn">Settings</button>
                <button id="howToBtn">How To</button>
            </div>
        </header>

        <section class="card exercise-card">
            <div id="next-exercise"></div>
            <img id="next-exercise-img" class="exercise-media" alt="Next Exercise Image" />
            <video id="next-exercise-video" class="exercise-media" controls muted loop></video>

            <div class="exercise-display">
                <div id="current-exercise" class="exercise-name"></div>
                <img id="exercise-img" class="exercise-media" src="" alt="Current Exercise Image" />
                <div id="exercise-text" class="exercise-media"></div>
                <video id="exercise-video" class="exercise-media" src="" alt="Current Exercise Video" controls muted loop></video>
            </div>
            <div id="exercise-explanation"></div>
        </section>

        <section class="card timer-card">
            <div id="workout-duration"></div>
            <div id="timer"></div>
            <div id="status"></div>
            <div id="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
            <div class="button-container">
                <button id="startBtn">Start</button>
                <button id="pauseBtn" disabled>Pause</button>
                <button id="resumeBtn" disabled>Resume</button>
                <button id="resetBtn" disabled>Reset</button>
                <button id="skipBtn" disabled>Skip</button>
            </div>
        </section>
    </main>

    <div id="howToModal" class="modal">
        <div class="modal-content">
            <span id="closeHowToBtn">&times;</span>
            <h2>Exercise Guide</h2>
            <div id="exerciseList"></div>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span id="closeSettingsBtn">&times;</span>
            <h2>Workout Settings</h2>
            <div id="settingsContent">
                <div class="setting-group">
                    <h3>Difficulty</h3>
                    <label>
                        <input type="radio" name="difficulty" value="easy">
                        Easy (50% reps)
                    </label>
                    <label>
                        <input type="radio" name="difficulty" value="normal" checked>
                        Normal (100% reps)
                    </label>
                    <label>
                        <input type="radio" name="difficulty" value="hard">
                        Hard (200% reps)
                    </label>
                </div>
                <div class="setting-group">
                    <h3>Exercise Groups</h3>
                    <label>
                        <input type="checkbox" id="includeFlow" checked>
                        Include Flow exercises
                    </label>
                </div>
                <div class="setting-group">
                    <h3>Rounds</h3>
                    <div>
                        <label for="maxRounds">Number of rounds:</label>
                        <input type="number" id="maxRounds" min="0" max="10" value="5">
                    </div>
                    <small>Each round includes Arms, Core, Legs, and optionally Flow</small>
                </div>
                <div class="setting-group">
                    <h3>Favorite Exercises (Always Include)</h3>
                    <div id="favoriteExercises"></div>
                </div>
                <div class="setting-group">
                    <h3>Excluded Exercises (Never Include)</h3>
                    <div id="excludedExercises"></div>
                </div>
                <button id="saveSettingsBtn">Save Settings</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
